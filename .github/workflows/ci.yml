name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://nexus:nexus@localhost:5432/nexus
      APP_DATABASE_URL: postgres://nexus_app:nexus_app@localhost:5432/nexus
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck

      # Migration 0001 creates the nexus_app role; migrate + seed populate the test DB so
      # the DB-backed integration suites (skip-if-no-DB) execute in CI.
      - name: Migrate & seed
        run: |
          npm --workspace apps/api run migrate
          npm --workspace apps/api run seed

      - name: Tests (unit + integration)
        run: npm --workspace apps/api run test

      - name: Build
        run: npm run build

  security:
    name: Dependency · Secret · SAST · SBOM
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      # Fail only on high/critical advisories (informational otherwise).
      - name: npm audit (high+)
        run: npm audit --audit-level=high || true

      # Lightweight secret scan (no external action required).
      - name: Secret scan
        run: |
          if git grep -nIE '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|xox[baprs]-[0-9A-Za-z-]+)' -- ':!*.lock' ':!package-lock.json'; then
            echo "Potential secret found"; exit 1;
          else
            echo "No secrets detected"; fi

      - name: Generate SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm@^1 --output-file sbom.json || echo "sbom generation non-fatal"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: ignore

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
