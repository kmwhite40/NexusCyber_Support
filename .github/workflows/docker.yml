name: Docker images

# Builds the API and Web container images, smoke-tests the API image end-to-end
# (migrate + seed + /readyz) against a real Postgres, and publishes to GHCR on
# pushes (not PRs). Separate from ci.yml so the two don't collide.

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  api:
    name: API image — build · smoke · publish
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      DB_ADMIN: postgres://nexus:nexus@localhost:5432/nexus
      DB_APP: postgres://nexus_app:nexus_app@localhost:5432/nexus
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Build API image (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: anchor-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Migrate + seed via the image
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="$DB_ADMIN" -e APP_DATABASE_URL="$DB_APP" \
            anchor-api:ci sh -c "node dist/db/migrate.js && node dist/db/seed.js"

      - name: Run API container and check readiness
        run: |
          docker run -d --name api --network host \
            -e SESSION_SIGNING_KEY=ci-only -e API_PORT=4000 \
            -e DATABASE_URL="$DB_ADMIN" -e APP_DATABASE_URL="$DB_APP" \
            anchor-api:ci
          echo "waiting for /readyz…"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/readyz || true)
            [ "$code" = "200" ] && break; sleep 2
          done
          echo "healthz: $(curl -s http://localhost:4000/healthz)"
          echo "readyz:  $(curl -s http://localhost:4000/readyz)"
          curl -sf http://localhost:4000/readyz | grep -q '"status":"ready"'
          docker logs api 2>&1 | tail -20 || true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push API image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/anchor-api:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/anchor-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    name: Web image — build · publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          build-args: |
            NEXT_PUBLIC_API_BASE=http://localhost:4000/api/v1
          tags: anchor-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Web image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE=http://localhost:4000/api/v1
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/anchor-web:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/anchor-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
