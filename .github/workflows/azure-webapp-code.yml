name: Deploy Web (Code) to Azure Gov App Service

# Deploys apps/web as "Code" to an Azure (Government) App Service — the M365GCC pattern
# (Node 20-LTS, Linux). App Service builds it with Oryx, so set these on the web app FIRST:
#   - App setting  SCM_DO_BUILD_DURING_DEPLOYMENT = true
#   - App setting  NEXT_PUBLIC_API_BASE = https://<api-host>.azurewebsites.us/api/v1
#   - Startup command: npm run start
#
# Secrets/vars to add in the repo:
#   - secret AZURE_WEBAPP_PUBLISH_PROFILE  (App Service -> Get publish profile)
#   - var    AZURE_WEBAPP_NAME             (e.g. M365GCC or anchor-web)
#
# Publish-profile auth targets the app's *.scm.azurewebsites.us (Kudu) endpoint, which
# works against Azure Government.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/web/**', '.github/workflows/azure-webapp-code.yml']

jobs:
  deploy-web:
    name: Build (Oryx) & deploy apps/web
    runs-on: ubuntu-latest
    environment: azure-gov
    steps:
      - uses: actions/checkout@v4

      # Deploy the apps/web source; App Service (Oryx) runs npm install + next build.
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: apps/web
