<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="NexusCyber">
  <defs>
    <linearGradient id="nxMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8eef6"/>
      <stop offset="0.5" stop-color="#90a3b8"/>
      <stop offset="1" stop-color="#3d4957"/>
    </linearGradient>
  </defs>
  <!-- four circuit arms with 90deg rotational symmetry -->
  <g fill="none" stroke="url(#nxMetal)" stroke-width="3" stroke-linecap="round">
    <g id="nxArm">
      <path d="M32 12 A20 20 0 0 1 52 32"/>
      <path d="M32 19 A13 13 0 0 1 45 32"/>
      <path d="M46.14 17.86 L41.19 22.81"/>
      <circle cx="32" cy="12" r="2.6" fill="url(#nxMetal)" stroke="none"/>
      <circle cx="41.19" cy="22.81" r="2" fill="url(#nxMetal)" stroke="none"/>
    </g>
    <use href="#nxArm" transform="rotate(90 32 32)"/>
    <use href="#nxArm" transform="rotate(180 32 32)"/>
    <use href="#nxArm" transform="rotate(270 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="2.4" fill="url(#nxMetal)"/>
</svg>
